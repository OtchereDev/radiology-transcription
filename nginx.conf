events {
    worker_connections 2048;
}

http {
    upstream medical_dictation {
        server medical-dictation-streaming:5000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=streaming:10m rate=30r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # File size limits for audio uploads
        client_max_body_size 50M;
        client_body_buffer_size 1M;

        # Timeouts for streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Main application
        location / {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://medical_dictation;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support - CRITICAL for streaming
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Disable buffering for WebSocket
            proxy_buffering off;
            
            # Keep connection alive
            proxy_request_buffering off;
        }

        # Socket.IO specific endpoint
        location /socket.io/ {
            limit_req zone=streaming burst=50 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://medical_dictation;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Critical for WebSocket
            proxy_buffering off;
            proxy_cache off;
            
            # Long timeouts for persistent connections
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://medical_dictation/health;
            access_log off;
        }

        # Stats endpoint (light rate limiting)
        location /stats {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://medical_dictation/stats;
        }
    }
}
