version: "3.8"

services:
  medical-dictation-streaming:
    build:
      context: .
      dockerfile: Dockerfile
    image: medical-dictation-streaming:latest
    container_name: medical-dictation-streaming
    ports:
      - "80:5000"
    environment:
      - FLASK_ENV=production
      - WHISPER_MODEL_SIZE=base
      - PYTHONUNBUFFERED=1
      - MAX_CONCURRENT_SESSIONS=10
      - SECRET_KEY=${SECRET_KEY:-streaming-medical-secret-change-in-prod}
      - LOG_LEVEL=INFO
    
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - faster_whisper_cache:/home/appuser/.cache/faster-whisper
      - torch_hub_cache:/home/appuser/.cache/torch
    
    # Fix for ctranslate2 executable stack issue
    security_opt:
      - seccomp:unconfined
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    networks:
      - medical-network

volumes:
  faster_whisper_cache:
    driver: local
  torch_hub_cache:
    driver: local

networks:
  medical-network:
    driver: bridge