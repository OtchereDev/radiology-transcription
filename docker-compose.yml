version: "3.8"

services:
  medical-dictation:
    image: otcheredev/dragon-dictator]
    ports:
      - "80:5000"
      - "443:5000" # For HTTPS in production
    environment:
      - FLASK_ENV=production
      - WHISPER_MODEL_SIZE=large-v3
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - model_cache:/root/.cache/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro # For SSL certificates
    depends_on:
      - medical-dictation
    restart: unless-stopped

volumes:
  model_cache:
    driver: local
