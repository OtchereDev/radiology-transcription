<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streaming Medical Dictation - WORKING</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .header {
        background: #667eea;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .controls {
        padding: 20px;
        background: #f8f9fa;
        display: flex;
        justify-content: center;
        gap: 20px;
      }
      .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-start {
        background: #28a745;
        color: white;
      }
      .btn-stop {
        background: #dc3545;
        color: white;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #6c757d;
      }
      .status-dot.active {
        background: #28a745;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }
      .content {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 20px;
        padding: 20px;
      }
      .sidebar {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
      }
      .sidebar h3 {
        color: #667eea;
        margin-bottom: 10px;
      }
      .stat {
        padding: 8px 0;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        justify-content: space-between;
      }
      .transcript-area {
        background: white;
        border: 1px solid #e9ecef;
        border-radius: 8px;
        padding: 20px;
        min-height: 400px;
      }
      .transcript {
        line-height: 1.8;
        font-size: 16px;
        color: #333;
      }
      .segment {
        margin-bottom: 10px;
        animation: fadeIn 0.3s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎤 Streaming Medical Dictation</h1>
        <p>Real-time speech recognition with Faster-Whisper + Silero VAD</p>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn btn-start">Start Streaming</button>
        <button id="stopBtn" class="btn btn-stop" disabled>
          Stop Streaming
        </button>
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Ready</span>
        </div>
      </div>

      <div class="content">
        <div class="sidebar">
          <h3>📊 Stats</h3>
          <div class="stat">
            <span>Words:</span><strong id="wordCount">0</strong>
          </div>
          <div class="stat">
            <span>Segments:</span><strong id="segmentCount">0</strong>
          </div>
          <div class="stat">
            <span>Duration:</span><strong id="duration">00:00</strong>
          </div>
        </div>

        <div class="transcript-area">
          <div id="transcript" class="transcript">
            <em>Start speaking to see transcription...</em>
          </div>
        </div>
      </div>
    </div>

    <script>
      let socket = null;
      let audioContext = null;
      let mediaStream = null;
      let scriptProcessor = null;
      let isStreaming = false;
      let stats = { words: 0, segments: 0 };
      let startTime = null;

      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const transcript = document.getElementById("transcript");

      // Initialize
      document.addEventListener("DOMContentLoaded", () => {
        socket = io();

        socket.on("connect", () => {
          console.log("Connected");
          updateStatus("Connected", false);
        });

        socket.on("streaming_started", (data) => {
          console.log("Streaming started:", data);
        });

        socket.on("transcription_result", (result) => {
          console.log("Transcription:", result);
          if (result.success && result.text) {
            addTranscription(result.text);
          }
        });

        startBtn.addEventListener("click", startStreaming);
        stopBtn.addEventListener("click", stopStreaming);
      });

      async function startStreaming() {
        try {
          console.log("Starting...");

          // Get microphone
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              sampleRate: 16000,
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
            },
          });

          // Create audio context
          audioContext = new (window.AudioContext || window.webkitAudioContext)(
            { sampleRate: 16000 }
          );
          const source = audioContext.createMediaStreamSource(mediaStream);

          // Create processor (4096 samples = ~256ms at 16kHz)
          scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

          scriptProcessor.onaudioprocess = (e) => {
            if (!isStreaming) return;

            const inputData = e.inputBuffer.getChannelData(0);

            // Convert float32 to int16
            const int16Data = new Int16Array(inputData.length);
            for (let i = 0; i < inputData.length; i++) {
              const s = Math.max(-1, Math.min(1, inputData[i]));
              int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }

            // Send as base64
            const base64 = btoa(
              String.fromCharCode.apply(null, new Uint8Array(int16Data.buffer))
            );
            socket.emit("audio_chunk", { audio: base64 });
          };

          source.connect(scriptProcessor);
          scriptProcessor.connect(audioContext.destination);

          // Tell server to start
          socket.emit("start_streaming");

          isStreaming = true;
          startTime = Date.now();
          startBtn.disabled = true;
          stopBtn.disabled = false;
          updateStatus("Streaming", true);

          // Update duration
          setInterval(updateDuration, 1000);
        } catch (error) {
          console.error("Error:", error);
          alert("Could not start: " + error.message);
        }
      }

      function stopStreaming() {
        console.log("Stopping...");

        isStreaming = false;

        if (scriptProcessor) {
          scriptProcessor.disconnect();
          scriptProcessor = null;
        }

        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = null;
        }

        if (audioContext) {
          audioContext.close();
          audioContext = null;
        }

        socket.emit("stop_streaming");

        startBtn.disabled = false;
        stopBtn.disabled = true;
        updateStatus("Ready", false);
      }

      function addTranscription(text) {
        if (transcript.querySelector("em")) {
          transcript.innerHTML = "";
        }

        const segment = document.createElement("div");
        segment.className = "segment";
        segment.textContent = text;
        transcript.appendChild(segment);

        stats.segments++;
        stats.words += text.split(/\s+/).length;

        document.getElementById("segmentCount").textContent = stats.segments;
        document.getElementById("wordCount").textContent = stats.words;

        segment.scrollIntoView({ behavior: "smooth" });
      }

      function updateStatus(text, active) {
        statusText.textContent = text;
        statusDot.className = "status-dot" + (active ? " active" : "");
      }

      function updateDuration() {
        if (!startTime) return;
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;
        document.getElementById("duration").textContent = `${mins
          .toString()
          .padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
      }
    </script>
  </body>
</html>
